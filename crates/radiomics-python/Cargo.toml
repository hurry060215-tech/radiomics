[package]
name = "ov-radiomics-python"
description = "PyO3 bindings for the independent ov-radiomics numerical core"
readme = "README.md"
include = ["/src", "/tests", "/build.rs", "/README.md", "/package-assets"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
ov-radiomics-core = { path = "../radiomics-core", version = "0.1.0" }
pyo3 = { version = "0.30.1", features = ["abi3-py39", "extension-module"] }
numpy = "0.30"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
