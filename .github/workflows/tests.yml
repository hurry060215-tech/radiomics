name: tests
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p ov-radiomics-core -p ov-radiomics-cli --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ matrix.python }}
      - name: Set up portable Python tooling on the current Ubuntu runner
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          enable-cache: false
      - name: Create the exact release-test interpreter independently of Ubuntu's tool cache
        if: runner.os == 'Linux'
        run: |
          uv python install "${{ matrix.python }}"
          uv venv --managed-python --python "${{ matrix.python }}" --seed "$RUNNER_TEMP/radiomics-release-python"
          echo "$RUNNER_TEMP/radiomics-release-python/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/radiomics-release-python" >> "$GITHUB_ENV"
      - name: Verify the selected Python version
        run: python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'; print(sys.version)"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin==1.16.0' pytest nbformat nbclient ipykernel
      - run: python tools/package_native.py --output artifacts/package-assets-receipt
      - name: Build the manylinux2014 x86_64 release candidate
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.16.0
          manylinux: '2014'
          target: x86_64
          args: --release --locked --out dist -i python${{ matrix.python }}
      - name: Build the Windows x86_64 release candidate
        if: runner.os == 'Windows'
        run: python -m maturin build --release --locked --out dist --target x86_64-pc-windows-msvc
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',glob.glob('dist/*.whl')[0]+'[reference]'])"
      - run: python -c "import ov_radiomics as rad; assert rad.backend_info()['metrics_backend'] == 'rust'"
      - run: python -m pytest -q --import-mode=importlib -o pythonpath=
        env:
          MPLBACKEND: Agg
      - name: Record candidate wheel checksums
        run: python -c "import hashlib; from pathlib import Path; d=Path('dist'); d.joinpath('SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(d.glob('*.whl'))), encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/SHA256SUMS
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin==1.16.0'
      - run: python tools/package_native.py --output artifacts/package-assets-receipt
      - run: python -m maturin sdist --out dist
      - name: Record source-distribution checksums
        run: python -c "import hashlib; from pathlib import Path; d=Path('dist'); d.joinpath('SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(d.glob('*.tar.gz'))), encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
  install-from-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      # Deliberately no checkout: installation and tests use only the artifact.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: ${{ runner.temp }}/radiomics-dist
      - run: python -m pip install pytest
      - name: Unpack the artifact and copy acceptance tests outside its source tree
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile

          temporary = Path(os.environ['RUNNER_TEMP'])
          archives = list((temporary / 'radiomics-dist').glob('*.tar.gz'))
          assert len(archives) == 1, archives
          unpacked = temporary / 'radiomics-sdist-source'
          unpacked.mkdir()
          with tarfile.open(archives[0]) as archive:
              for member in archive.getmembers():
                  assert member.isfile() or member.isdir(), member.name
                  assert (unpacked / member.name).resolve().is_relative_to(unpacked.resolve())
              archive.extractall(unpacked)
          roots = list(unpacked.iterdir())
          assert len(roots) == 1 and roots[0].is_dir(), roots
          source = roots[0]
          tests = temporary / 'radiomics-installed-tests'
          tests.mkdir()
          for name in ('test_native_extraction.py', 'test_split_plan.py'):
              shutil.copy2(source / 'tests' / name, tests / name)
          assert not (tests / 'src' / 'ov_radiomics').exists()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'SDIST_SOURCE={source}\nSDIST_TESTS={tests}\n')
          PY
      - name: Install directly from the unpacked source distribution
        working-directory: ${{ env.SDIST_SOURCE }}
        run: python -m pip install .
      - name: Verify installed native backend outside the source tree
        working-directory: ${{ env.SDIST_TESTS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          import ov_radiomics as radiomics

          package = Path(radiomics.__file__).resolve()
          assert package.is_relative_to(Path(sys.prefix).resolve()), package
          assert not package.is_relative_to(Path(os.environ['SDIST_SOURCE']).resolve())
          assert not (Path.cwd() / 'src' / 'ov_radiomics').exists()
          print(package)
          print(radiomics.backend_info())
          assert radiomics.backend_info()['metrics_backend'] == 'rust'
          PY
      - name: Run extraction and split-plan acceptance against the installed package
        working-directory: ${{ env.SDIST_TESTS }}
        run: python -m pytest test_native_extraction.py test_split_plan.py -q --import-mode=importlib -o pythonpath=
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies without compiling the extension
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)['project']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *project['dependencies'], *project['optional-dependencies']['reference'], *project['optional-dependencies']['test']])
          PY
      - run: python -c "import ov_radiomics as rad; assert rad.backend_info()['metrics_backend'] == 'unavailable'; assert rad.binary_metrics([0,0,1,1],[.1,.4,.35,.8],backend='python').auc == .75"
        env:
          PYTHONPATH: src
      - run: python -m pytest -q tests/test_golden_reference.py tests/test_golden_models.py tests/test_golden_statistics.py tests/test_golden_baseline.py tests/test_golden_tables.py tests/test_golden_workflow.py tests/test_golden_fusion.py tests/test_golden_evaluation.py tests/test_golden_forest.py tests/test_golden_icc.py tests/test_golden_ibsi.py tests/test_golden_pathology.py tests/test_golden_pathology_aggregate.py tests/test_golden_separation.py tests/test_golden_research.py tests/test_golden_wsidata.py tests/test_benchmark_protocol.py tests/test_interop_conversion.py
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'numpy<2' 'setuptools<81' wheel SimpleITK PyWavelets pykwalify
      - run: python -m pip install --no-build-isolation 'pyradiomics==3.0.1'
      - run: python tools/package_native.py --output artifacts/package-assets-receipt
      - run: python -m pip install -e '.[test,boost,reference]'
      - run: python -c "import ov_radiomics as rad; assert rad.backend_info()['metrics_backend'] == 'rust'"
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
      - run: python examples/demo.py --output artifacts/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-demo
          path: |
            artifacts/demo/*.csv
            artifacts/demo/*.png
            artifacts/demo/provenance.json
  native-only:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.9,<2' pytest
      - run: python tools/package_native.py --output artifacts/package-assets-receipt
      - run: python -m maturin build --release --locked --out dist
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',glob.glob('dist/*.whl')[0]])"
      - name: Check reference packages are absent
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('sklearn','statsmodels','scipy','radiomics','SimpleITK','joblib','omicverse','wsidata'))"
      - run: python -m pytest -q tests/test_native_extraction.py tests/test_native_image_api.py tests/test_split_plan.py tests/test_native_learning_api.py tests/test_native_clinical_api.py tests/test_native_pathology_api.py tests/test_native_research_api.py tests/test_native_api_audit.py tests/test_interop_native.py tests/test_native_accuracy_known_gap.py --import-mode=importlib -o pythonpath=
        env:
          MPLBACKEND: Agg
      - run: cargo build --release -p ov-radiomics-cli --locked
      - name: Install isolated notebook execution tools
        if: runner.os == 'Linux'
        run: python -m pip install nbformat nbclient ipykernel
      - name: Execute six synthetic tutorials with the installed native wheel
        if: runner.os == 'Linux'
        run: |
          python tools/build_tutorial_notebooks.py --output artifacts/tutorial-inputs
          python tools/run_tutorials.py --notebooks artifacts/tutorial-inputs --output artifacts/tutorial-execution
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: executed-native-tutorials
          path: artifacts/tutorial-execution
      - uses: actions/upload-artifact@v4
        with:
          name: native-cli-${{ matrix.os }}
          path: |
            target/release/radiomics
            target/release/radiomics.exe
  cli-no-python:
    runs-on: ubuntu-latest
    needs: native-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-cli-ubuntu-latest
          path: cli-artifact
      - run: chmod +x cli-artifact/radiomics
      - run: docker pull ubuntu:24.04
      - name: Run native workflows with no Python and no container network
        run: |
          mkdir -p artifacts/cli-no-python
          docker image inspect ubuntu:24.04 --format '{{.Id}}' > artifacts/cli-no-python/container-image.txt
          docker run --rm --network none \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/src,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/cli-artifact",target=/cli,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/artifacts/cli-no-python",target=/out \
            ubuntu:24.04 sh /src/tools/check_cli_no_python.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-no-python-evidence
          path: artifacts/cli-no-python
