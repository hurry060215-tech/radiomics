name: documentation
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r website/requirements.txt
      - name: Record the checked-out documentation revision
        run: |
          python - <<'PY'
          import os
          from tools.build_website_sources import ROOT, source_revision
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write('RADIOMICS_BUILD_REVISION=' + source_revision(ROOT) + '\n')
          PY
      - run: python tools/build_website_sources.py
      - name: Remove stale rendered documentation
        run: rm -rf website/_build
      - run: python -m sphinx -W --keep-going -b html website website/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: website/_build/html
      - name: Configure Pages for an explicit publication
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the published revision and retired page responses
        run: >-
          python tools/check_documentation_publication.py
          --base-url "${{ needs.deploy.outputs.page_url }}"
          --revision "${{ github.sha }}"
          --attempts 6 --retry-seconds 5
